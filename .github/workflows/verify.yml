name: Verificar simulação

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar importação geográfica
        run: node --test tests/test_azgaar.mjs tests/test_azgaar_real.mjs
      - name: Baixar Godot oficial
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Importar projeto
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Testar economia, consequências e salvamento
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_kingdom.gd
      - name: Verificar inicialização da interface
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_ui.gd
      - name: Testar diplomacia, autonomia e compatibilidade
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_politics.gd
      - name: Testar seleção e integridade de atualizações
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_updater.gd
      - name: Testar mapa, seleção e integração com a partida
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_map.gd
      - name: Testar atlas real e navegação
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_atlas.gd
  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar aplicação, reversão e proteção de arquivos
        shell: powershell
        run: ./tests/test_update_windows.ps1
